[project]
name = "localcode"
version = "2.0.0"
description = "Python tooling for localcode's engines: reference forwards, tiny oracle fixture, tokenizer parity, the API server"
requires-python = ">=3.10"
# Pinned exact so the reference the C engine is graded against does not drift.
dependencies = [
    "numpy",
    "safetensors",
    "torch==2.14.0",
    "transformers==5.20.2",
]

[dependency-groups]
dev = [
    "ruff==0.16.9",
]
